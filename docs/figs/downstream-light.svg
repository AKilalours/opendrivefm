<svg xmlns="http://www.w3.org/2000/svg" width="880" height="352" viewBox="0 0 880 352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="880" height="352" fill="#ffffff"/><text x="0" y="26" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Gating free space on camera evidence catches more unseen obstacles</text><text x="0" y="48" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">Hazard recall at a fixed 10% alarm budget, by look-ahead horizon. 2,933 held-out frames.</text><rect x="0" y="62" width="11" height="11" rx="2" fill="#2a78d6"/><text x="18" y="72" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">observability-gated</text><rect x="156" y="62" width="11" height="11" rx="2" fill="#eb6834"/><text x="174" y="72" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">predicted-free only</text><line x1="72" y1="286" x2="840" y2="286" stroke="#e6e5e2" stroke-width="1"/><rect x="86" y="134.4" width="76" height="151.6" rx="4" fill="#2a78d6"/><text x="124.0" y="124.4375" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">28.4%</text><rect x="170" y="171.4" width="76" height="114.6" rx="4" fill="#eb6834"/><text x="208.0" y="161.40396341463415" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">21.5%</text><text x="166" y="308" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="400">H = 10 m</text><text x="166" y="326" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400">+32% relative</text><rect x="358" y="181.8" width="76" height="104.2" rx="4" fill="#2a78d6"/><text x="396.0" y="171.8030731707317" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">19.5%</text><rect x="442" y="187.4" width="76" height="98.6" rx="4" fill="#eb6834"/><text x="480.0" y="177.3545487804878" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">18.5%</text><text x="438" y="308" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="400">H = 20 m</text><text x="438" y="326" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400">+6% relative</text><rect x="630" y="205.9" width="76" height="80.1" rx="4" fill="#2a78d6"/><text x="668.0" y="195.86678907982264" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">15.0%</text><rect x="714" y="209.4" width="76" height="76.6" rx="4" fill="#eb6834"/><text x="752.0" y="199.37860310421286" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">14.4%</text><text x="710" y="308" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="400">H = 30 m</text><text x="710" y="326" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400">+5% relative</text><text x="0" y="342" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Primary endpoint H = 20 m, declared on the dev split before the test split was opened. AUROC gain excludes zero at all three horizons.</text></svg>