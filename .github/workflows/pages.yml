# Publishes index.html to GitHub Pages.
#
# This replaces the built-in branch-based deployment, for one reason: that
# workflow is generated by GitHub and cannot be given a concurrency rule, so
# two pushes close together produce two deployments that collide, and the
# second dies with "due to in progress deployment" instead of queueing. The
# concurrency block below is the fix.
#
# It also narrows what is served. Branch-based Pages published the entire
# repository root, so archive/, paper/ and docs/ were all browsable as part of
# the site. index.html is self-contained -- no local assets, only Google Fonts
# and four outbound links -- so staging that one file is enough.
#
# REQUIRES: Settings -> Pages -> Source set to "GitHub Actions". With the
# source still set to a branch, this workflow fails exactly the way the
# built-in one is currently failing.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer deployment supersedes a queued older one instead of colliding with
# it. Only the latest page matters, so cancelling the one it replaces is
# correct, not lossy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the page
        run: mkdir -p _site && cp index.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
